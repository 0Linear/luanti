name: vita

# Builds luanti.vpk for the PlayStation Vita.
# - every run uploads the VPK as a workflow artifact
# - pushing a tag starting with "vita-" or "v" (e.g. vita-1.0, v5.15.0)
#   publishes it as a GitHub release
# - "Run workflow" on the Actions tab builds on demand; enter a tag name to
#   also publish a release
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
      - 'vita-*'
    paths:
      - 'lib/**'
      - 'src/**'
      - 'irr/**'
      - 'builtin/**'
      - 'client/shaders/**'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'misc/vita/**'
      - 'util/vita/**'
      - '.github/workflows/vita.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'irr/**'
      - 'client/shaders/**'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'misc/vita/**'
      - 'util/vita/**'
      - '.github/workflows/vita.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (empty: build only)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
    - name: Install build tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends unzip gettext git ca-certificates

    - uses: actions/checkout@v7

    # Dependencies (SQLite, vitaGL, possibly cURL and libzip) rarely change
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: build/vita/deps
        key: vita-deps-${{ hashFiles('util/vita/build.sh') }}

    - name: Build
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        util/vita/build.sh build/vita
        cp build/vita/luanti.vpk luanti-vita.vpk

    - uses: actions/upload-artifact@v7
      with:
        name: luanti-vita
        path: luanti-vita.vpk
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        name: luanti-vita

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: Luanti for PlayStation Vita ${{ inputs.release_tag || github.ref_name }}
        prerelease: true
        files: luanti-vita.vpk
        body: |
          Luanti for the PlayStation Vita (homebrew VPK).

          **Install**
          1. A Vita with HENkaku/Ensō.
          2. Extract `libshacccg.suprx` to `ur0:data/` (e.g. with ShaRKBR33D) – required for shaders.
          3. Install `luanti-vita.vpk` with VitaShell.
          4. Install a game from the content browser, or copy one to `ux0:data/luanti/games/`.

          The first start compiles all shaders and takes a while; later starts use the cache.
          See [doc/vita.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/doc/vita.md) for controls and settings.

          ⚠️ Experimental: not yet tested on real hardware.
